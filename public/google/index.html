<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#012d1d">
<title>Scorpion Golf Cart Rental on Google Maps</title>
<link rel="icon" href="/scorpionlogo.png" type="image/png">
<!--
  Short, permanent Google Business Profile link:
  https://www.scorpiongolfcarts.com/google
  Opens the profile in the Google Maps app on phones (or Maps web), on any device.
-->
<script>
  var PROFILE = 'https://maps.google.com/?cid=16527417127535337220';
  var ua = navigator.userAgent;
  var android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  var inApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Snapchat|TikTok|musical_ly|BytedanceWebview|Line\/|Twitter/i.test(ua);
  var target = android && inApp
    ? 'intent://' + PROFILE.replace(/^https:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(PROFILE) + ';end'
    : PROFILE; // Maps links open fine even in iOS in-app browsers (no sign-in needed to view).
  location.replace(target);
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #012d1d; color: #fff; text-align: center; }
  a { display: inline-block; margin-top: 18px; padding: 16px 24px; border-radius: 16px; background: #f2b544; color: #012d1d; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <main>
    <img src="/scorpionlogo.png" alt="Scorpion Golf Cart Rental logo" width="84" height="84" style="border-radius:50%;background:#fff">

    <a href="https://maps.google.com/?cid=16527417127535337220">Open Google Maps</a>
  </main>
</body>
</html>
